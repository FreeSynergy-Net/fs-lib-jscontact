[package]
name = "fs-lib-jscontact"
description = "JSContact card (RFC 9553): typed model, validation and JSON import/export, without storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Without it the parser can be one step off a double, and a valid float would not come back exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
